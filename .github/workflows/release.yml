name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Release title'
        required: false
        default: 'iQOO Battery Health Inspector Release'
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # If no custom release key provided, use debug.keystore for release signing in CI
          if [ ! -f "my-upload-key.jks" ] && [ -z "$KEYSTORE_PATH" ]; then
            echo "Setting fallback keystore for release signing in CI..."
            cp debug.keystore my-upload-key.jks
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
            export KEY_ALIAS="androiddebugkey"
          fi

      - name: Build APKs
        run: |
          chmod +x gradlew
          # Build both release and debug APKs
          ./gradlew assembleDebug assembleRelease || ./gradlew assembleDebug

      - name: Prepare APK Assets
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            dest="build-apks/iQOO-Battery-Health-${filename}"
            echo "Copying $apk -> $dest"
            cp "$apk" "$dest"
          done
          echo "Collected APKs:"
          ls -lh build-apks/

      - name: Determine Release Tag
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            TITLE="${{ inputs.release_title || inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
            TITLE="iQOO Battery Health Inspector ${TAG}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Upload APK Directly to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            build-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
